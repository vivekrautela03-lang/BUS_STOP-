<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <!-- Bus Body Gradient -->
    <linearGradient id="busBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdb833"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Window Reflection Gradient -->
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#384358"/>
      <stop offset="50%" stop-color="#242c3d"/>
      <stop offset="100%" stop-color="#181e2b"/>
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55657e"/>
      <stop offset="50%" stop-color="#2c3748"/>
      <stop offset="100%" stop-color="#18202c"/>
    </linearGradient>
  </defs>

  <!-- Bus Main Body Shadow underneath -->
  <ellipse cx="50" cy="70" rx="38" ry="4" fill="rgba(34,30,26,0.22)"/>

  <!-- Left/Rear Wheel -->
  <g class="wheel-group">
    <circle cx="28" cy="64" r="11" fill="#1e2229" stroke="#12151a" stroke-width="2"/>
    <circle cx="28" cy="64" r="5" fill="#e2e8f0"/>
    <circle cx="28" cy="64" r="2" fill="#1e2229"/>
  </g>

  <!-- Right/Front Wheel -->
  <g class="wheel-group">
    <circle cx="75" cy="64" r="11" fill="#1e2229" stroke="#12151a" stroke-width="2"/>
    <circle cx="75" cy="64" r="5" fill="#e2e8f0"/>
    <circle cx="75" cy="64" r="2" fill="#1e2229"/>
  </g>

  <!-- Main Chassis / Cab Body -->
  <path d="M 16,30 
           C 16,16 26,10 40,10 
           L 74,10 
           C 84,10 92,16 93,28 
           L 94,48 
           C 94,56 90,62 84,62 
           L 78,62 
           A 3,3 0 0,1 72,62 
           L 32,62 
           A 3,3 0 0,1 24,62 
           L 18,62 
           C 14,62 12,56 12,48 
           L 12,38 
           C 12,33 14,30 16,30 Z" 
        fill="url(#busBodyGrad)" 
        stroke="#241e18" 
        stroke-width="3.2" 
        stroke-linejoin="round"/>

  <!-- Roof highlight arc -->
  <path d="M 24,14 C 34,12 60,12 76,14" 
        fill="none" 
        stroke="#fef08a" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.8"/>

  <!-- Front Windshield -->
  <path d="M 72,17 
           L 86,17 
           C 89,17 91,20 90.5,24 
           L 89,38 
           C 88.5,40 86.5,41 84.5,41 
           L 72,41 
           Z" 
        fill="url(#windshieldGrad)" 
        stroke="#241e18" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
  <!-- Front Windshield Reflection -->
  <path d="M 76,20 L 86,20 C 87.5,20 88,21.5 87.5,23 L 86,29 Z" fill="#94a3b8" opacity="0.6"/>

  <!-- Side Windows (3 rounded square windows in a row) -->
  <rect x="20" y="17" width="14" height="23" rx="3.5" fill="url(#windowGrad)" stroke="#241e18" stroke-width="2.4"/>
  <rect x="37" y="17" width="14" height="23" rx="3.5" fill="url(#windowGrad)" stroke="#241e18" stroke-width="2.4"/>
  <rect x="54" y="17" width="14" height="23" rx="3.5" fill="url(#windowGrad)" stroke="#241e18" stroke-width="2.4"/>

  <!-- Window Gleam Highlights -->
  <path d="M 23,19 L 29,19 C 30.5,19 31,20 30.5,22 L 23,26 Z" fill="#64748b" opacity="0.5"/>
  <path d="M 40,19 L 46,19 C 47.5,19 48,20 47.5,22 L 40,26 Z" fill="#64748b" opacity="0.5"/>
  <path d="M 57,19 L 63,19 C 64.5,19 65,20 64.5,22 L 57,26 Z" fill="#64748b" opacity="0.5"/>

  <!-- Front Headlight (Round yellow/white glowing beam) -->
  <path d="M 93,45 C 95,45 96,47 96,50 C 96,53 95,55 93,55 Z" fill="#fef08a" stroke="#241e18" stroke-width="1.8"/>
  <path d="M 94,47 C 95,47 95.5,48 95.5,50 C 95.5,52 95,53 94,53 Z" fill="#ffffff"/>

  <!-- Front Bumper -->
  <rect x="91" y="55" width="4" height="6" rx="2" fill="#334155" stroke="#241e18" stroke-width="1.5"/>

  <!-- Rear Tail Light -->
  <rect x="10.5" y="46" width="3" height="6" rx="1.5" fill="#ef4444" stroke="#241e18" stroke-width="1.5"/>

  <!-- Door Line & Handle -->
  <line x1="69" y1="16" x2="69" y2="60" stroke="#241e18" stroke-width="1.6" opacity="0.7"/>
  <rect x="71" y="47" width="3.5" height="2" rx="1" fill="#1e2229"/>

  <!-- Lower Body Accent Line / Trim -->
  <path d="M 13,53 L 93,53" stroke="#b45309" stroke-width="2.2" opacity="0.6"/>

  <!-- Cute Mountain Bus badge on door -->
  <circle cx="44" cy="51" r="2.5" fill="#fef08a" stroke="#241e18" stroke-width="0.8"/>
</svg>
