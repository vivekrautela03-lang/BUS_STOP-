<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="aadhaarBackBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="aBackShad" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="416" height="256" rx="14" fill="url(#aadhaarBackBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#aBackShad)"/>

  <!-- Top Authority Bar -->
  <g transform="translate(18, 12)">
    <!-- Aadhaar Logo icon -->
    <circle cx="16" cy="16" r="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#ea580c"/>
    <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1e293b">भारतीय विशिष्ट पहचान प्राधिकरण</text>
    <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569">Unique Identification Authority of India</text>
  </g>

  <!-- Tricolor horizontal line -->
  <line x1="18" y1="46" x2="402" y2="46" stroke="#ea580c" stroke-width="1.8"/>

  <!-- Address in Hindi -->
  <g transform="translate(20, 58)">
    <text x="0" y="12" font-family="sans-serif" font-size="8" font-weight="700" fill="#475569">पता:</text>
    <text x="0" y="24" font-family="sans-serif" font-size="8" fill="#1e293b">आत्मज: सुरेश रौतेला, प्रेम नगर, देहरादून,</text>
    <text x="0" y="36" font-family="sans-serif" font-size="8" fill="#1e293b">उत्तराखंड - 248007</text>
  </g>

  <!-- Address in English -->
  <g transform="translate(20, 110)">
    <text x="0" y="12" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#475569">Address:</text>
    <text x="0" y="26" font-family="sans-serif" font-size="8.5" fill="#0f172a">S/O: Suresh Rautela, Prem Nagar, Dehradun,</text>
    <text x="0" y="40" font-family="sans-serif" font-size="8.5" fill="#0f172a">Uttarakhand - 248007</text>
  </g>

  <!-- Large QR Code on Right -->
  <g transform="translate(276, 56)">
    <rect x="0" y="0" width="116" height="116" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Simulated QR pattern -->
    <rect x="10" y="10" width="30" height="30" fill="#0f172a"/>
    <rect x="16" y="16" width="18" height="18" fill="#ffffff"/>
    <rect x="21" y="21" width="8" height="8" fill="#0f172a"/>

    <rect x="76" y="10" width="30" height="30" fill="#0f172a"/>
    <rect x="82" y="16" width="18" height="18" fill="#ffffff"/>
    <rect x="87" y="21" width="8" height="8" fill="#0f172a"/>

    <rect x="10" y="76" width="30" height="30" fill="#0f172a"/>
    <rect x="16" y="82" width="18" height="18" fill="#ffffff"/>
    <rect x="21" y="87" width="8" height="8" fill="#0f172a"/>

    <!-- Data matrix bars -->
    <rect x="46" y="14" width="8" height="14" fill="#0f172a"/>
    <rect x="58" y="10" width="12" height="8" fill="#0f172a"/>
    <rect x="46" y="34" width="24" height="6" fill="#0f172a"/>
    <rect x="14" y="46" width="20" height="8" fill="#0f172a"/>
    <rect x="38" y="46" width="10" height="24" fill="#0f172a"/>
    <rect x="52" y="46" width="18" height="14" fill="#0f172a"/>
    <rect x="74" y="46" width="12" height="8" fill="#0f172a"/>
    <rect x="92" y="46" width="14" height="20" fill="#0f172a"/>
    <rect x="52" y="66" width="8" height="24" fill="#0f172a"/>
    <rect x="64" y="70" width="26" height="8" fill="#0f172a"/>
    <rect x="76" y="84" width="16" height="20" fill="#0f172a"/>
    <rect x="46" y="96" width="24" height="8" fill="#0f172a"/>
  </g>

  <!-- Help & Toll Free Line -->
  <g transform="translate(20, 184)">
    <rect x="0" y="0" width="380" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="14" y="20" font-family="sans-serif" font-size="8" font-weight="700" fill="#0369a1">📞 1947</text>
    <text x="90" y="20" font-family="sans-serif" font-size="8" fill="#64748b">help@uidai.gov.in</text>
    <text x="260" y="20" font-family="sans-serif" font-size="8" font-weight="700" fill="#15803d">www.uidai.gov.in</text>
  </g>

  <!-- Green Verified Badge -->
  <g transform="translate(382, 222)">
    <circle cx="14" cy="14" r="14" fill="#10b981"/>
    <path d="M8 14 L12 18 L20 10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
