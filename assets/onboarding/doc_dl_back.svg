<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="dlBackBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadowB" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="416" height="256" rx="14" fill="url(#dlBackBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadowB)"/>

  <!-- Top Blue Authority Header -->
  <rect x="2" y="2" width="416" height="26" rx="14" fill="#0369a1"/>
  <rect x="2" y="16" width="416" height="12" fill="#0369a1"/>
  <text x="210" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">TRANSPORT DEPARTMENT UTTARAKHAND</text>

  <!-- Authorization Table -->
  <g transform="translate(18, 38)">
    <rect x="0" y="0" width="240" height="92" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header Row -->
    <rect x="0" y="0" width="240" height="20" fill="#f1f5f9"/>
    <text x="12" y="14" font-size="8" font-weight="700" fill="#475569">COV</text>
    <text x="56" y="14" font-size="8" font-weight="700" fill="#475569">DOI</text>
    <text x="110" y="14" font-size="8" font-weight="700" fill="#475569">VALIDITY</text>
    <text x="180" y="14" font-size="8" font-weight="700" fill="#475569">BADGE NO</text>
    <line x1="0" y1="20" x2="240" y2="20" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="12" y="38" font-size="8" font-weight="800" fill="#0f172a">MCWG</text>
    <text x="56" y="38" font-size="7.5" fill="#334155">15-01-2025</text>
    <text x="110" y="38" font-size="7.5" fill="#334155">14-01-2045</text>
    <text x="180" y="38" font-size="7.5" fill="#334155">-</text>
    <line x1="0" y1="44" x2="240" y2="44" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Row 2 -->
    <text x="12" y="60" font-size="8" font-weight="800" fill="#0f172a">LMV</text>
    <text x="56" y="60" font-size="7.5" fill="#334155">15-01-2025</text>
    <text x="110" y="60" font-size="7.5" fill="#334155">14-01-2045</text>
    <text x="180" y="60" font-size="7.5" fill="#334155">-</text>
    <line x1="0" y1="66" x2="240" y2="66" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Row 3: Commercial / Bus Special -->
    <text x="12" y="82" font-size="8" font-weight="800" fill="#b91c1c">TRANS</text>
    <text x="56" y="82" font-size="7.5" fill="#334155">15-01-2025</text>
    <text x="110" y="82" font-size="7.5" font-weight="700" fill="#15803d">14-01-2030</text>
    <text x="180" y="82" font-size="7.5" font-weight="700" fill="#0369a1">UK-BDG-8821</text>
  </g>

  <!-- Large QR Code on Right -->
  <g transform="translate(278, 38)">
    <rect x="0" y="0" width="112" height="112" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- QR pattern simulation -->
    <rect x="10" y="10" width="28" height="28" fill="#0f172a"/>
    <rect x="16" y="16" width="16" height="16" fill="#ffffff"/>
    <rect x="20" y="20" width="8" height="8" fill="#0f172a"/>

    <rect x="74" y="10" width="28" height="28" fill="#0f172a"/>
    <rect x="80" y="16" width="16" height="16" fill="#ffffff"/>
    <rect x="84" y="20" width="8" height="8" fill="#0f172a"/>

    <rect x="10" y="74" width="28" height="28" fill="#0f172a"/>
    <rect x="16" y="80" width="16" height="16" fill="#ffffff"/>
    <rect x="20" y="84" width="8" height="8" fill="#0f172a"/>

    <!-- Noise / Data bits -->
    <rect x="44" y="14" width="6" height="12" fill="#0f172a"/>
    <rect x="54" y="10" width="14" height="6" fill="#0f172a"/>
    <rect x="44" y="32" width="24" height="6" fill="#0f172a"/>
    <rect x="14" y="44" width="18" height="6" fill="#0f172a"/>
    <rect x="36" y="44" width="8" height="20" fill="#0f172a"/>
    <rect x="48" y="44" width="18" height="12" fill="#0f172a"/>
    <rect x="72" y="44" width="12" height="6" fill="#0f172a"/>
    <rect x="90" y="44" width="12" height="18" fill="#0f172a"/>
    <rect x="48" y="60" width="6" height="24" fill="#0f172a"/>
    <rect x="58" y="64" width="24" height="8" fill="#0f172a"/>
    <rect x="72" y="78" width="14" height="18" fill="#0f172a"/>
    <rect x="44" y="90" width="22" height="8" fill="#0f172a"/>
    <rect x="92" y="72" width="10" height="26" fill="#0f172a"/>
  </g>

  <!-- Organ Donor / Badge Info -->
  <g transform="translate(18, 140)">
    <text x="0" y="12" font-size="7.5" font-weight="700" fill="#0f172a">ORGAN DONOR: <tspan fill="#16a34a">YES</tspan></text>
    <text x="0" y="24" font-size="7.5" fill="#64748b">Emergency Contact: Suresh Rautela (+91 98765 43211)</text>
    <text x="0" y="36" font-size="7" fill="#94a3b8">Note: In case of accident or loss, report immediately to nearest police station.</text>
  </g>

