<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <filter id="insShad" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="416" height="256" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#insShad)"/>

  <!-- Top Ribbon -->
  <rect x="2" y="2" width="416" height="32" rx="14" fill="#4338ca"/>
  <rect x="2" y="20" width="416" height="14" fill="#4338ca"/>
  <text x="210" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">COMMERCIAL VEHICLE INSURANCE CERTIFICATE</text>
  <text x="210" y="30" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#c7d2fe" text-anchor="middle">NATIONAL INSURANCE COMPANY LTD. (POLICY SCHEDULE)</text>

  <!-- Policy Header -->
  <g transform="translate(18, 44)">
    <rect x="0" y="0" width="384" height="42" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <text x="14" y="26" font-family="monospace" font-size="12" font-weight="900" fill="#312e81">POLICY: NIC-CV-2025-99410</text>
    <rect x="250" y="10" width="120" height="24" rx="12" fill="#4f46e5"/>
    <text x="310" y="26" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">COMPREHENSIVE ✓</text>
  </g>

  <!-- Policy Details Table -->
  <g transform="translate(18, 96)">
    <rect x="0" y="0" width="384" height="106" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

    <text x="14" y="20" font-size="8" font-weight="700" fill="#64748b">Insured Bus:</text>
    <text x="110" y="20" font-family="monospace" font-size="8.5" font-weight="800" fill="#0f172a">UK07 PA 1234 (TATA STARBUS 45S)</text>

    <text x="14" y="38" font-size="8" font-weight="700" fill="#64748b">Insured Name:</text>
    <text x="110" y="38" font-size="8.5" font-weight="700" fill="#0f172a">VIVEK RAUTELA / UTC TRANSIT</text>

    <text x="14" y="56" font-size="8" font-weight="700" fill="#64748b">IDV (Insured Value):</text>
    <text x="110" y="56" font-size="8.5" font-weight="800" fill="#15803d">₹ 32,50,000.00</text>

    <text x="14" y="74" font-size="8" font-weight="700" fill="#64748b">Passenger Liability:</text>
    <text x="110" y="74" font-size="8.5" font-weight="800" fill="#4338ca">COVERED (UP TO 45 PASSENGERS)</text>

    <text x="14" y="92" font-size="8" font-weight="700" fill="#64748b">Validity Period:</text>
    <text x="110" y="92" font-size="8.5" font-weight="800" fill="#312e81">24-04-2025 to 23-04-2026</text>
  </g>

  <!-- Green Verified Badge -->
  <g transform="translate(382, 222)">
    <circle cx="14" cy="14" r="14" fill="#10b981"/>
    <path d="M8 14 L12 18 L20 10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
