<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="panGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="panShad" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="416" height="256" rx="14" fill="url(#panGrad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#panShad)"/>

  <!-- Top Blue Header -->
  <g transform="translate(18, 14)">
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#0369a1">आयकर विभाग</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#0c4a6e">INCOME TAX DEPARTMENT</text>

    <!-- Center Emblem -->
    <g transform="translate(180, -2)">
      <circle cx="12" cy="12" r="11" fill="#f8fafc" stroke="#93c5fd" stroke-width="0.8"/>
      <path d="M12 4 L14 9 L19 10 L15 14 L16 19 L12 16 L8 19 L9 14 L5 10 L10 9 Z" fill="#0369a1" transform="scale(0.8) translate(3,2)"/>
    </g>

    <text x="380" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#0369a1" text-anchor="end">भारत सरकार</text>
    <text x="380" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#0c4a6e" text-anchor="end">GOVT. OF INDIA</text>
  </g>

  <!-- Photo Box -->
  <rect x="20" y="56" width="84" height="106" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="62" cy="94" r="24" fill="#cbd5e1"/>
  <path d="M36 152 C36 126 88 126 88 152 Z" fill="#94a3b8"/>

  <!-- Center Portrait Watermark (Mahatma Gandhi outline) -->
  <circle cx="210" cy="110" r="32" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="210" cy="100" r="16" fill="#bae6fd" opacity="0.5"/>

  <!-- Info block -->
  <g transform="translate(120, 56)">
    <text x="0" y="14" font-size="8" fill="#64748b">नाम / Name</text>
    <text x="0" y="28" font-family="sans-serif" font-size="11.5" font-weight="900" fill="#0f172a" letter-spacing="0.4">AMIT SHARMA</text>

    <text x="0" y="48" font-size="8" fill="#64748b">पिता का नाम / Father's Name</text>
    <text x="0" y="62" font-family="sans-serif" font-size="10" font-weight="800" fill="#1e293b">RAMESH SHARMA</text>

    <text x="0" y="82" font-size="8" fill="#64748b">जन्म की तारीख / Date of Birth</text>
    <text x="0" y="96" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">15/03/1995</text>
  </g>

  <!-- Right QR Code on PAN -->
  <g transform="translate(296, 56)">
    <rect x="0" y="0" width="88" height="88" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <!-- QR pattern -->
    <rect x="8" y="8" width="22" height="22" fill="#0f172a"/>
    <rect x="12" y="12" width="14" height="14" fill="#ffffff"/>
    <rect x="16" y="16" width="6" height="6" fill="#0f172a"/>

    <rect x="58" y="8" width="22" height="22" fill="#0f172a"/>
    <rect x="62" y="12" width="14" height="14" fill="#ffffff"/>
    <rect x="66" y="16" width="6" height="6" fill="#0f172a"/>

    <rect x="8" y="58" width="22" height="22" fill="#0f172a"/>
    <rect x="12" y="62" width="14" height="14" fill="#ffffff"/>
    <rect x="16" y="66" width="6" height="6" fill="#0f172a"/>

    <rect x="36" y="12" width="6" height="16" fill="#0f172a"/>
    <rect x="36" y="34" width="18" height="6" fill="#0f172a"/>
    <rect x="12" y="36" width="16" height="6" fill="#0f172a"/>
    <rect x="58" y="36" width="12" height="18" fill="#0f172a"/>
    <rect x="36" y="52" width="8" height="18" fill="#0f172a"/>
    <rect x="48" y="58" width="20" height="8" fill="#0f172a"/>
  </g>

  <!-- Signature -->
  <g transform="translate(20, 172)">
    <rect x="0" y="0" width="84" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M12 24 Q 28 8 46 22 T 74 16" stroke="#0f172a" stroke-width="1.6" fill="none"/>
    <text x="42" y="40" font-size="7" fill="#64748b" text-anchor="middle">हस्ताक्षर / Signature</text>
  </g>

  <!-- Permanent Account Number Badge -->
  <g transform="translate(120, 168)">
    <text x="0" y="10" font-size="8" font-weight="700" fill="#64748b">स्थायी खाता संख्या / Permanent Account Number</text>
    <rect x="0" y="16" width="210" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="105" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">
      ABCDE1234F
    </text>
  </g>

  <!-- Green Verified Badge -->
  <g transform="translate(382, 222)">
    <circle cx="14" cy="14" r="14" fill="#10b981"/>
    <path d="M8 14 L12 18 L20 10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
