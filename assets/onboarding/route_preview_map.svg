<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" style="border-radius:12px;display:block;">
  <defs>
    <!-- Terrain Gradient -->
    <linearGradient id="terrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4edd8"/>
      <stop offset="30%" stop-color="#c8e6c9"/>
      <stop offset="70%" stop-color="#bfe0c2"/>
      <stop offset="100%" stop-color="#c5e1a5"/>
    </linearGradient>

    <!-- Mountain Shading -->
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a5d6a7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#81c784" stop-opacity="0.5"/>
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90caf9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#64b5f6" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Route Glow Filter -->
    <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>

    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Terrain -->
  <rect width="540" height="320" fill="url(#terrainGrad)"/>

  <!-- Topographic Elevation Patches (Hills & Forest) -->
  <path d="M 0,0 Q 80,60 140,40 T 260,30 T 400,10 L 540,0 L 540,90 Q 420,70 340,110 T 200,80 T 80,120 L 0,80 Z" fill="url(#hillGrad1)" opacity="0.65"/>
  <path d="M 320,60 Q 420,100 480,80 T 540,120 L 540,240 Q 460,200 400,220 T 320,180 Z" fill="#9ccc65" opacity="0.4"/>
  <path d="M 0,220 Q 90,200 160,250 T 280,280 L 280,320 L 0,320 Z" fill="url(#hillGrad1)" opacity="0.5"/>

  <!-- Mountain Contours (Subtle Gray/Green curves) -->
  <path d="M 40,20 Q 120,70 200,50 T 360,40" fill="none" stroke="#81c784" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <path d="M 360,110 Q 440,140 500,120" fill="none" stroke="#81c784" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <path d="M 380,230 Q 440,250 510,240" fill="none" stroke="#81c784" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Minor Secondary Roads / Connectors -->
  <path d="M 120,40 Q 140,110 160,180 T 220,290" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 280,140 Q 320,130 380,160 T 460,180" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 50,140 Q 110,130 180,160" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>

  <!-- River (Song / Ganga tributary) -->
  <path d="M 180,0 Q 210,60 230,130 T 290,200 T 370,270 T 440,320" fill="none" stroke="url(#riverGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Area / Town Labels on Map -->
  <text x="140" y="135" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#4b5563" letter-spacing="0.2">Doiwala</text>
  <text x="175" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#6b7280" letter-spacing="0.2">Ranipokhari</text>
  <text x="430" y="135" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#4b5563" letter-spacing="0.2">Neelkanth</text>
  <text x="160" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="#6b7280">Haridwar Rd</text>

  <!-- MAIN BUS ROUTE POLYLINE (Dehradun ISBT -> Rishikesh) -->
  <path d="M 85,55 C 105,75 125,85 145,105 C 165,125 178,142 195,160 C 215,182 225,190 245,210 C 265,230 280,240 300,248 C 325,258 350,265 375,270 C 390,273 402,275 415,275" 
        fill="none" 
        stroke="#1d4ed8" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#routeGlow)"/>

  <!-- Waypoint Stop Dots along Route -->
  <circle cx="145" cy="105" r="3.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="210" cy="175" r="3.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="300" cy="248" r="3.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="375" cy="270" r="3.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>

  <!-- START PIN: Dehradun (ISBT) -->
  <g transform="translate(48, 24)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="102" height="32" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
    <!-- Green Pin Icon -->
    <circle cx="16" cy="16" r="8" fill="#10b981"/>
    <circle cx="16" cy="16" r="3" fill="#ffffff"/>
    <text x="31" y="20.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Dehradun</text>
  </g>

  <!-- END PIN: Rishikesh -->
  <g transform="translate(390, 246)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="98" height="32" rx="16" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
    <!-- Red Pin Icon -->
    <circle cx="16" cy="16" r="8" fill="#ef4444"/>
    <circle cx="16" cy="16" r="3" fill="#ffffff"/>
    <text x="31" y="20.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Rishikesh</text>
  </g>
</svg>
