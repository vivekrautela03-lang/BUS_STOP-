<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="dlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="416" height="256" rx="14" fill="url(#dlBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Top Header Ribbon -->
  <rect x="2" y="2" width="416" height="34" rx="14" fill="url(#headerGrad)"/>
  <rect x="2" y="24" width="416" height="12" fill="url(#headerGrad)"/>
  <text x="210" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">INDIAN UNION DRIVING LICENCE</text>
  <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#fecaca" text-anchor="middle" letter-spacing="0.3">GOVERNMENT OF UTTARAKHAND</text>

  <!-- Left Photo Box -->
  <rect x="18" y="48" width="82" height="98" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="59" cy="84" r="22" fill="#cbd5e1"/>
  <path d="M34 136 C34 114 84 114 84 136 Z" fill="#94a3b8"/>
  <!-- Hologram Stamp -->
  <circle cx="86" cy="134" r="11" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" opacity="0.85"/>
  <text x="86" y="137" font-size="7" font-weight="900" fill="#854d0e" text-anchor="middle">IND</text>

  <!-- Smart Chip Graphic -->
  <rect x="114" y="50" width="38" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>
  <rect x="122" y="56" width="22" height="18" rx="2" fill="#f59e0b" opacity="0.4"/>
  <line x1="114" y1="65" x2="152" y2="65" stroke="#b45309" stroke-width="0.8"/>
  <line x1="133" y1="50" x2="133" y2="80" stroke="#b45309" stroke-width="0.8"/>

  <!-- Licence Details -->
  <text x="164" y="58" font-family="monospace" font-size="9" font-weight="800" fill="#0f172a">DL NO: UK07 20250012345</text>
  <text x="164" y="72" font-family="sans-serif" font-size="8" fill="#475569">AUTHORIZATION: <tspan font-weight="700" fill="#0f172a">LMV / TRANS / PSV</tspan></text>
  <text x="114" y="98" font-family="sans-serif" font-size="8.5" fill="#64748b">Name:</text>
  <text x="156" y="98" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#0f172a">VIVEK RAUTELA</text>

  <text x="114" y="114" font-family="sans-serif" font-size="8.5" fill="#64748b">S/O:</text>
  <text x="156" y="114" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1e293b">SURESH RAUTELA</text>

  <text x="114" y="130" font-family="sans-serif" font-size="8.5" fill="#64748b">DOB:</text>
  <text x="156" y="130" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1e293b">10-07-2007</text>
  <text x="240" y="130" font-family="sans-serif" font-size="8.5" fill="#64748b">Blood:</text>
  <text x="274" y="130" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#b91c1c">B+</text>

  <text x="114" y="146" font-family="sans-serif" font-size="8.5" fill="#64748b">Valid Upto:</text>
  <text x="172" y="146" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#15803d">14-01-2030 (TRANS)</text>

  <!-- Address Block -->
  <line x1="18" y1="160" x2="402" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <text x="18" y="176" font-family="sans-serif" font-size="8" fill="#64748b">Address: <tspan font-weight="600" fill="#1e293b">Prem Nagar, Dehradun, Uttarakhand - 248007</tspan></text>
  <text x="18" y="190" font-family="sans-serif" font-size="8" fill="#64748b">Issuing Authority: <tspan font-weight="600" fill="#1e293b">RTO Dehradun, Uttarakhand</tspan></text>

  <!-- Signature area -->
  <path d="M28 228 Q 45 210 65 224 T 95 218" stroke="#1e293b" stroke-width="1.6" fill="none"/>
  <text x="60" y="244" font-family="sans-serif" font-size="7" fill="#64748b" text-anchor="middle">Holder Signature</text>

  <!-- Optical Barcode Mockup -->
  <g transform="translate(200, 214)">
    <rect x="0" y="0" width="2" height="26" fill="#1e293b"/>
    <rect x="4" y="0" width="1" height="26" fill="#1e293b"/>
    <rect x="7" y="0" width="3" height="26" fill="#1e293b"/>
    <rect x="12" y="0" width="1.5" height="26" fill="#1e293b"/>
    <rect x="16" y="0" width="2" height="26" fill="#1e293b"/>
    <rect x="20" y="0" width="3" height="26" fill="#1e293b"/>
    <rect x="25" y="0" width="1" height="26" fill="#1e293b"/>
    <rect x="28" y="0" width="2.5" height="26" fill="#1e293b"/>
    <rect x="33" y="0" width="2" height="26" fill="#1e293b"/>
    <rect x="37" y="0" width="1" height="26" fill="#1e293b"/>
    <rect x="41" y="0" width="3" height="26" fill="#1e293b"/>
    <rect x="46" y="0" width="1.5" height="26" fill="#1e293b"/>
    <rect x="50" y="0" width="2" height="26" fill="#1e293b"/>
    <rect x="54" y="0" width="1" height="26" fill="#1e293b"/>
    <rect x="57" y="0" width="3" height="26" fill="#1e293b"/>
    <rect x="62" y="0" width="2" height="26" fill="#1e293b"/>
  </g>

  <!-- Green Verified Badge -->
  <g transform="translate(382, 222)">
    <circle cx="14" cy="14" r="14" fill="#10b981"/>
    <path d="M8 14 L12 18 L20 10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
