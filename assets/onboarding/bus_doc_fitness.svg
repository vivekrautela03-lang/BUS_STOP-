<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <filter id="fitShad" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="416" height="256" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#fitShad)"/>

  <!-- Top Ribbon -->
  <rect x="2" y="2" width="416" height="32" rx="14" fill="#047857"/>
  <rect x="2" y="20" width="416" height="14" fill="#047857"/>
  <text x="210" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">CERTIFICATE OF FITNESS (FORM 38)</text>
  <text x="210" y="30" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">MOTOR VEHICLES DEPT - TESTED &amp; COMPLIANT</text>

  <!-- Fitness Summary Card -->
  <g transform="translate(18, 44)">
    <rect x="0" y="0" width="384" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="26" font-family="monospace" font-size="13" font-weight="900" fill="#065f46">VEHICLE: UK07 PA 1234</text>
    <rect x="260" y="10" width="110" height="24" rx="12" fill="#10b981"/>
    <text x="315" y="26" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">ROADWORTHY ✓</text>
  </g>

  <!-- Test Metrics Table -->
  <g transform="translate(18, 96)">
    <rect x="0" y="0" width="384" height="106" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

    <text x="14" y="20" font-size="8" font-weight="700" fill="#64748b">Inspection Station:</text>
    <text x="110" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Automated Testing Center, Dehradun</text>

    <text x="14" y="38" font-size="8" font-weight="700" fill="#64748b">Braking Efficiency:</text>
    <text x="110" y="38" font-size="8.5" font-weight="800" fill="#15803d">94% (PASSED)</text>

    <text x="14" y="56" font-size="8" font-weight="700" fill="#64748b">Headlight &amp; Signaling:</text>
    <text x="110" y="56" font-size="8.5" font-weight="800" fill="#15803d">ALIGNED (PASSED)</text>

    <text x="14" y="74" font-size="8" font-weight="700" fill="#64748b">Speed Governor:</text>
    <text x="110" y="74" font-size="8.5" font-weight="800" fill="#1e3a8a">CALIBRATED TO 80 KM/H</text>

    <text x="14" y="92" font-size="8" font-weight="700" fill="#64748b">Validity Period:</text>
    <text x="110" y="92" font-size="8.5" font-weight="800" fill="#047857">15-05-2025 to 14-05-2027</text>
  </g>

  <!-- Green Verified Badge -->
  <g transform="translate(382, 222)">
    <circle cx="14" cy="14" r="14" fill="#10b981"/>
    <path d="M8 14 L12 18 L20 10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
