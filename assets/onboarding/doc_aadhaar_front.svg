<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="aadhaarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <filter id="aShad" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="416" height="256" rx="14" fill="url(#aadhaarBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#aShad)"/>

  <!-- Top Header Bar with Ashoka Emblem / Govt of India -->
  <g transform="translate(18, 12)">
    <!-- Ashoka Lion Pillar Icon -->
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <path d="M16 6 L19 12 L24 13 L20 17 L21 23 L16 20 L11 23 L12 17 L8 13 L13 12 Z" fill="#b45309" transform="scale(0.7) translate(7,5)"/>
    </g>
    <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1e293b">भारत सरकार</text>
    <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#475569">GOVERNMENT OF INDIA</text>
  </g>

  <!-- Right Aadhaar Sun Symbol -->
  <g transform="translate(356, 12)">
    <circle cx="18" cy="18" r="8" fill="#ea580c"/>
    <path d="M18 4 L18 8 M18 28 L18 32 M4 18 L8 18 M28 18 L32 18 M8 8 L11 11 M25 25 L28 28 M8 28 L11 25 M25 11 L28 8" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tricolor horizontal accent line -->
  <line x1="18" y1="48" x2="402" y2="48" stroke="#f97316" stroke-width="1.8"/>

  <!-- Photo Box -->
  <rect x="20" y="60" width="84" height="106" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="62" cy="98" r="24" fill="#cbd5e1"/>
  <path d="M36 156 C36 130 88 130 88 156 Z" fill="#94a3b8"/>

  <!-- Info block -->
  <g transform="translate(120, 62)">
    <text x="0" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">विवेक रौतेला</text>
    <text x="0" y="34" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#0f172a" letter-spacing="0.2">VIVEK RAUTELA</text>

    <text x="0" y="56" font-family="sans-serif" font-size="9" fill="#475569">जन्म तिथि / DOB: <tspan font-weight="700" fill="#0f172a">10/07/2007</tspan></text>
    <text x="0" y="74" font-family="sans-serif" font-size="9" fill="#475569">पुरुष / MALE</text>
  </g>

  <!-- Big Aadhaar Number -->
  <g transform="translate(20, 186)">
    <rect x="0" y="0" width="380" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="190" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" font-weight="800" fill="#dc2626" text-anchor="middle" letter-spacing="3.5">
      XXXX  XXXX  1234
    </text>
  </g>

  <!-- Bottom Slogan Ribbon -->
  <rect x="2" y="226" width="416" height="32" rx="14" fill="#b91c1c"/>
  <rect x="2" y="226" width="416" height="10" fill="#b91c1c"/>
  <text x="210" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    आधार - आम आदमी का अधिकार
  </text>

  <!-- Green Verified Badge -->
  <g transform="translate(382, 222)">
    <circle cx="14" cy="14" r="14" fill="#10b981"/>
    <path d="M8 14 L12 18 L20 10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
